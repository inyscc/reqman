[package]
name = "reqman"
version = "0.4.0"
description = "Offline, local-first API client"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reqman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# --- network (D11: rustls + system roots, no OpenSSL) ---
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "socks",
    "json",
    "multipart",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "cookies",
] }

# --- PAC 求值（本变更 D2：纯 Rust JS 引擎）---
# `default` 里含 `temporal`（拖入 temporal_rs）与 `float16`/`xsum`，三者对 PAC 都无用；
# `intl` 虽不在 `default` 里，但显式关掉默认特性一并杜绝 `icu_*`。`js` 是 wasm 目标用的
# 弱特性（见其定义：只挂 web-time / getrandom 的 wasm 变体），原生构建不需要。
boa_engine = { version = "0.22", default-features = false }

# --- cookie jar (add-pm-script-runtime D14: 成熟实现，不自行写匹配语义) ---
reqwest_cookie_store = "0.8"
cookie_store = "0.21"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
url = "2"
mime_guess = "2"
percent-encoding = "2"

# --- storage (D3: bundled SQLite, WAL, single writer) ---
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# --- secrets (D5: device-level key in OS credential store, AEAD at rest) ---
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

# --- logging (D6: single redaction chokepoint) ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# --- Windows 系统代理（本变更 D8）---
# 自己读 `Internet Settings`：reqwest 的 `system-proxy` 特性只认 `ProxyServer`、
# **从不看 `AutoConfigURL`**（PAC），而后者正是内网那台机器配代理的方式。
# `winreg` 0.55 本来就在锁文件里（`tauri-winres` → `embed-resource` 带进来的），
# 因此不新增任何 crate。
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
# 仅供测试期起一个自签证书的 HTTPS 服务器，用于验证证书校验的两条路径。
# 复用 reqwest 已经带入的 ring 后端，避免出现第二个 crypto provider。
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
