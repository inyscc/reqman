name: release

# 推 v* 标签时构建 Windows 安装包并创建 Release。
# 手动触发时只构建、把产物留成 Actions artifact，不碰 Release——正式打标签前先验证流水线用。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 标签即版本。tauri-action 用 tauri.conf.json 的版本去填 tagName，两处不一致会
      # 创建出一个和标签对不上的 Release，所以宁可在这一步就红掉。
      - name: 校验版本号与标签一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $expected = $tag.Substring(1)
          $confVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value

          "标签=$tag  tauri.conf.json=$confVersion  Cargo.toml=$cargoVersion  package.json=$pkgVersion"

          if ($confVersion -ne $expected -or $cargoVersion -ne $expected -or $pkgVersion -ne $expected) {
            throw "标签 $tag 与版本号不一致（期望 $expected）。请把 tauri.conf.json / Cargo.toml / package.json 的 version 改成同一个值，删除标签后重新打。"
          }

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 准备 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      # beforeBuildCommand 会先跑 tsc + vite build，dist 由 tauri.config.json 的
      # frontendDist 决定，因此不需要在这里单独 npm run build。
      - name: 打包并创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'reqman v__VERSION__'
          releaseBody: |
            安装包见下方 Assets：

            - `*-setup.exe` — NSIS 安装包，普通用户下载这个
            - `*.msi` — MSI，企业域部署用

            安装包未做代码签名，首次运行时 Windows 会提示「未知发布者」，
            选择「更多信息 → 仍要运行」即可。
          releaseDraft: true
          prerelease: false

      - name: 打包（手动触发，只构建不创建 Release）
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1

      - name: 留存产物
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: reqman-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
